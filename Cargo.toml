[package]
name = "xmip-core-authenticate-oauth2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-authenticate-oauth2"
description = "Authenticate by oauth2: verifies a token by introspection at the authorization server."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): authenticate for the trait and Presented, context
# for Verified, xcore for the mechanism catalog.
authenticate = { package = "xmip-core-authenticate", git = "https://github.com/IlleNilsson/xmip-core-authenticate", branch = "main" }
# identify for the principal name types: no technology parses a principal
# name itself (ADR-0054).
identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# RFC 7662 answers in JSON with a boolean and an `aud` of either shape;
serde_json = "1"
# The estate's base 64 (RFC 4648), which Basic client authentication travels in.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# The endpoint, the minimal HTTP/1.1 client the call goes over, and the
# percent-encoding of the token in the form body.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }
# The estate's TLS, which an https endpoint is asked in: the token and the
# client secret never cross a network in the clear.
tls = { package = "xmip-core-library-tls", git = "https://github.com/IlleNilsson/xmip-core-library-tls", branch = "main" }

[dev-dependencies]
# A self-signed certificate for the in-process authorization server the TLS
# test stands up.
rcgen = "0.14"

[lints]
workspace = true
